version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: wedapola-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-wedapola}
      - DB_USER=wedapola
      - DB_PASSWORD=${DB_PASSWORD:-wedapola_dev_password}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_refresh_secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - LOCAL_STORAGE_PATH=/app/storage
      - PUBLIC_STORAGE_BASE_URL=http://localhost:3000/storage
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
      - /app/node_modules
      - wedapola_storage:/app/storage
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ekafy-network"
      - "traefik.http.routers.wedapola.rule=Host(`${APP_HOST:-wadapola.ekafy.com}`)"
      - "traefik.http.routers.wedapola.entrypoints=web"
      - "traefik.http.services.wedapola.loadbalancer.server.port=3000"
    networks:
      - default
      - ekafy-network
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  mariadb:
    image: mariadb:10.11
    container_name: wedapola-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - MARIADB_DATABASE=${DB_NAME:-wedapola}
      - MARIADB_USER=wedapola
      - MARIADB_PASSWORD=${DB_PASSWORD:-wedapola_dev_password}
    volumes:
      - wedapola_db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: wedapola-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wedapola_redis_data:/data
    networks:
      - default
      - ekafy-network

volumes:
  wedapola_db_data:
  wedapola_storage:
  wedapola_redis_data:

networks:
  ekafy-network:
    external: true
    name: ekafy-network
