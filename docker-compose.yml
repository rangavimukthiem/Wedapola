version: '3.8'

services:
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=wedapola
      - DB_USER=wedapola
      - DB_PASSWORD=${DB_PASSWORD:-wedapola_dev_password}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_refresh_secret}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - LOCAL_STORAGE_PATH=/app/storage
      - PUBLIC_STORAGE_BASE_URL=http://localhost:3000/storage
      - S3_ENDPOINT=${S3_ENDPOINT:-https://4352dee482ad9384c863e51fd0672aaf.r2.cloudflarestorage.com}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-wedapola}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - wedapola_storage:/app/storage
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:10.11
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - MARIADB_DATABASE=wedapola
      - MARIADB_USER=wedapola
      - MARIADB_PASSWORD=${DB_PASSWORD:-wedapola_dev_password}
    volumes:
      - wedapola_db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  wedapola_db_data:
  wedapola_storage:
