<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedapola Admin - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#030712',
              card: '#0b1329',
              border: 'rgba(255, 255, 255, 0.08)',
              cyan: '#38bdf8'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#030712] text-slate-100 p-4">

  <div class="max-w-md w-full bg-[#0b1329] border border-white/10 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
    <!-- Glow effect -->
    <div class="absolute -top-12 -right-12 w-40 h-40 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 text-white font-black text-2xl mx-auto mb-3">
        W
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">Wedapola Admin</h1>
      <p class="text-xs text-slate-400 mt-1">Operational Desk & KYC Verification</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div id="loginError" class="hidden p-3 rounded-lg bg-rose-500/15 border border-rose-500/30 text-rose-400 text-xs"></div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username or Email</label>
        <input 
          type="text" 
          id="username" 
          required 
          value="admin"
          placeholder="admin or admin@wedapola.lk"
          class="w-full px-3.5 py-2.5 bg-[#040814] border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition-colors"
        />
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-semibold text-slate-300">Password</label>
          <span class="text-[11px] text-slate-500">Default: admin123</span>
        </div>
        <input 
          type="password" 
          id="password" 
          required 
          value="admin123"
          placeholder="••••••••" 
          class="w-full px-3.5 py-2.5 bg-[#040814] border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition-colors"
        />
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-sm rounded-xl transition-all shadow-lg shadow-cyan-500/25 mt-2">
        Sign In to Admin Desk
      </button>

      <div class="text-center mt-4">
        <a href="/" class="text-xs text-slate-400 hover:text-cyan-400 transition-colors">
          ← Back to Customer Job Portal
        </a>
      </div>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errBox = document.getElementById('loginError');
      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = 'Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('wedapola_admin_token', data.token);
          localStorage.setItem('wedapola_admin_user', JSON.stringify(data.user));
          window.location.replace('/admin/index.html');
        } else {
          errBox.innerText = data.error || 'Invalid admin credentials.';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = 'Network error. Please try again.';
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Sign In to Admin Desk';
      }
    }
  </script>
</body>
</html>
